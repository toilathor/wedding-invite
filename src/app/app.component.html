<div
  #pageContainer
  class="pageview-container bg-[#FBF7F5] selection:bg-[#A12F0C] selection:text-white">

  <!-- Toast Notification System -->
  <app-toast></app-toast>

  <!-- 1. Hero / Banner -->
  <div class="pageview-section !py-0 relative z-10 overflow-visible" id="page-banner">
    <app-banner [data]="weddingData.banner"></app-banner>
  </div>

  <!-- 2. Invitation & Countdown (White background) -->
  <div class="pageview-section !py-0" id="page-invitation">
    <app-invitation [data]="weddingData.invitation" (onOpenRsvp)="openRsvp()"></app-invitation>
  </div>

  <!-- 3. Introduction (Groom & Bride) -->
  <div class="pageview-section !py-0" id="page-introduction">
    <app-introduction [data]="weddingData.introduction"></app-introduction>
  </div>

  <!-- 4. Story (Love Story) -->
  <div class="pageview-section !py-0 relative z-20 overflow-visible" id="page-story">
    <app-story [data]="weddingData.story"></app-story>
  </div>

  <!-- 5. Timeline (Milestones - White background) -->
  <div class="pageview-section !py-0" id="page-timeline">
    <app-timeline [data]="weddingData.timeline"></app-timeline>
  </div>

  <!-- 6. Wedding Events -->
  <div class="pageview-section !py-0 relative z-30 overflow-visible" id="page-events">
    <app-events [events]="weddingData.events"></app-events>
  </div>

  <!-- 7. Wedding Photo Album & Lightbox -->
  <div class="pageview-section !py-0 relative z-10" id="page-album">
    <app-album [data]="weddingData.album"></app-album>
  </div>

  <!-- 8. Guestbook & Wishes (White background) -->
  <div class="pageview-section !py-0" id="page-guestbook">
    <app-guestbook></app-guestbook>
  </div>

  <!-- 9. Bank & Gift Registry + Footer -->
  <div class="pageview-section !py-0" id="page-bank-gift">
    <app-bank-gift [data]="weddingData.bank"></app-bank-gift>

    <!-- Footer -->
    <footer class="bg-[#2A1810] text-[#F4DBCE] pt-8 pb-10 sm:pt-10 sm:pb-12 px-6 sm:px-12 text-center border-t border-[#F4DBCE]/20 mt-0 relative z-10">
      <div class="max-w-md mx-auto space-y-2">
        <h3 class="text-2xl sm:text-3xl md:text-4xl font-pinyon text-white">
          Quang Thọ &amp; Thúy Hiền
        </h3>
        <p class="text-[11px] sm:text-xs md:text-sm font-light text-[#F4DBCE]/80 tracking-widest uppercase">
          28 . 11 . 2026 • Thank you for celebrating with us!
        </p>
        <div class="w-12 h-[1px] bg-[#F4DBCE]/30 mx-auto my-2"></div>
        <p class="text-[10px] sm:text-[11px] text-stone-400">
          Thiệp cưới số • Made with love &amp; happiness ❤️
        </p>
      </div>
    </footer>
  </div>

  <!-- Floating Page Indicator Dots (Mobile & Desktop - Always accessible & Easy to tap) -->
  <nav class="pageview-indicator flex" aria-label="Điều hướng trang">
    <button
      *ngFor="let page of pages; let i = index"
      type="button"
      (click)="goToPage(i)"
      class="pageview-dot-btn"
      [class.active]="pageViewService.currentPageIndex() === i"
      [title]="page.title"
      [attr.aria-label]="page.title">
      <span class="pageview-dot"></span>
    </button>
  </nav>

  <!-- Floating Audio Player (Bottom-Left) -->
  <app-music-player></app-music-player>

  <!-- Floating Quick Actions Menu (Bottom-Right) -->
  <app-quick-menu (onOpenRsvp)="openRsvp()"></app-quick-menu>

  <!-- RSVP Modal -->
  <app-rsvp-modal *ngIf="isRsvpOpen" (onClose)="closeRsvp()"></app-rsvp-modal>
</div>
